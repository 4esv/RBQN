[workspace]
resolver = "2"
members = [
    "crates/rbqn-core",
    "crates/rbqn-vm",
    "crates/rbqn-prim",
    "crates/rbqn-gpu",
    "crates/rbqn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "ISC"
repository = "https://github.com/4esv/RBQN"
rust-version = "1.88"
keywords = ["bqn", "array-language", "apl", "gpu", "interpreter"]
categories = ["compilers", "science"]

[workspace.dependencies]
rbqn-core = { version = "0.1.0", path = "crates/rbqn-core" }
rbqn-vm = { version = "0.1.0", path = "crates/rbqn-vm" }
rbqn-prim = { version = "0.1.0", path = "crates/rbqn-prim" }
rbqn-gpu = { version = "0.1.0", path = "crates/rbqn-gpu" }
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }
pollster = "0.4"

# NOTE: No panic = "abort": ⎊ and error reporting rely on catch_unwind.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
