name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # NOTE: Pins match the tree the suite and parity corpus were validated against.
  BQN_REV: f5706ec1aea51178ec905e896252b582556d7dc0
  CBQN_REV: f4257c14be5cbf1446ab2d0862af2391166d850b

jobs:
  build-test:
    # NOTE: macOS for Metal, so the GPU paths run under wgpu.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOTE: crates/rbqn/bins/*.bin are LFS; without this rbqn embeds pointer files and panics.
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Embed example
        run: cargo run --release --example embed

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Smoke
        # NOTE: RBQN_GPU_DEBUG=1 un-suppresses panic output so a silent exit 1 is visible.
        env:
          RBQN_GPU_DEBUG: "1"
          RUST_BACKTRACE: "1"
        run: test "$(target/release/rbqn -p '1+1')" = 2

      - name: Checkout BQN (pinned)
        uses: actions/checkout@v4
        with:
          repository: mlochbaum/BQN
          ref: ${{ env.BQN_REV }}
          path: _deps/BQN

      - name: Test suite
        env:
          BQN_TEST_DIR: ${{ github.workspace }}/_deps/BQN/test
        run: |
          ./test_suite.sh
          # NOTE: test_suite.sh exits 0 on failures in default mode and leaves crashes
          # out of total_fail; gate on every saved file row being PASS.
          ! grep -Ev '^(#.*)?$' .test-results/baseline-latest.txt | grep -v ' PASS|'

      - name: Cache CBQN
        id: cbqn-cache
        uses: actions/cache@v4
        with:
          path: _deps/CBQN/BQN
          key: cbqn-${{ runner.os }}-${{ runner.arch }}-${{ env.CBQN_REV }}

      - name: Build CBQN (pinned)
        if: steps.cbqn-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dzaima/CBQN.git _deps/CBQN-src
          git -C _deps/CBQN-src checkout "$CBQN_REV"
          make -C _deps/CBQN-src -j"$(sysctl -n hw.ncpu)"
          mkdir -p _deps/CBQN
          cp _deps/CBQN-src/BQN _deps/CBQN/BQN

      - name: Parity vs CBQN
        env:
          CBQN_BIN: ${{ github.workspace }}/_deps/CBQN/BQN
        run: ./test_parity.sh

      - name: Bench summary
        if: always() && steps.cbqn-cache.outcome != 'skipped'
        run: |
          brew install hyperfine
          {
            echo "## bench/compare.sh (CBQN ${CBQN_REV:0:7})"
            echo
            HYPERFINE="$(command -v hyperfine)" bench/compare.sh target/release/rbqn "$GITHUB_WORKSPACE/_deps/CBQN/BQN"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    # NOTE: Linux is where `cargo install rbqn` users are.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # NOTE: release profile; test_block_depth_bounded_by_stack only passes there.
      - name: Test
        run: cargo test --release --workspace

      - name: Gate script tests
        run: python3 -I bench/stranger/test_gate.py

  miri:
    # NOTE: the unsafe code lives in rbqn-core (stack probe), rbqn-prim (sort kernels)
    # and rbqn-vm (frame/scope pools, ScRef, bytecode decode); Miri checks all three.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri setup
        run: cargo miri setup

      # NOTE: -Zmiri-ignore-leaks: array handles are `Arc` pointers whose strong count is
      # intentionally never released (#124), and the interpreter's pools are thread-local
      # ManuallyDrop, so Miri's leak check would fail every test that tags an array or
      # evaluates BQN.
      - name: Miri (rbqn-core, rbqn-prim)
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks
        run: cargo miri test -p rbqn-core -p rbqn-prim

      # NOTE: same flag, same reason, for rbqn-vm. It is not an allowlist for
      # UB: all other checks (aliasing, uninit, bounds, validity) stay on. Isolation stays
      # on; tests needing the host (getcwd) are `#[cfg_attr(miri, ignore = ...)]`.
      - name: Miri (rbqn-vm)
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks
        run: cargo miri test -p rbqn-vm

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Pin CBQN commit
        id: pin
        run: echo "commit=$(tr -d '[:space:]' < bench/stranger/CBQN_COMMIT)" >> "$GITHUB_OUTPUT"

      - name: Cache CBQN
        id: cbqn-cache
        uses: actions/cache@v4
        with:
          path: _deps/CBQN-bin/BQN
          key: cbqn-parity-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.commit }}

      - name: Build CBQN
        if: steps.cbqn-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dzaima/CBQN.git _deps/CBQN-src
          git -C _deps/CBQN-src checkout "${{ steps.pin.outputs.commit }}"
          make -C _deps/CBQN-src -j"$(nproc)" CC=clang
          mkdir -p _deps/CBQN-bin
          cp _deps/CBQN-src/BQN _deps/CBQN-bin/BQN

      # NOTE: pinned (shallow) so a docs change upstream never turns the job red by itself.
      - name: Checkout BQN (pinned)
        uses: actions/checkout@v4
        with:
          repository: mlochbaum/BQN
          ref: ${{ env.BQN_REV }}
          path: _deps/BQN

      - name: Docs and grid vs CBQN
        env:
          CBQN_BIN: ${{ github.workspace }}/_deps/CBQN-bin/BQN
          BQN_SRC: ${{ github.workspace }}/_deps/BQN
          RBQN_BIN: ${{ github.workspace }}/target/release/rbqn
        run: |
          python3 -I bench/stranger/docs_diff.py | tee docs.out
          # NOTE: grid.py batches 300 cells with a 90s timeout each; the grid is not shrunk.
          python3 -I bench/stranger/grid.py | tee grid.out

      - name: Gate
        run: python3 -I bench/stranger/gate.py docs.out grid.out bench/stranger/known_divergences.txt
