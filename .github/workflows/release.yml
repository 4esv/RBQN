name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-13, experimental: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, experimental: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: false }
    steps:
      - uses: actions/checkout@v4
        with:
          # NOTE: crates/rbqn/bins/*.bin are LFS; without this rbqn embeds pointer files and panics.
          lfs: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p rbqn

      - name: Smoke (expects 45)
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          out="$(target/${{ matrix.target }}/release/rbqn$ext -p '+´↕10')"
          echo "$out"
          test "$out" = 45

      - name: Dynamic dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/rbqn
          if [ "${{ runner.os }}" = Linux ]; then ldd "$bin"; else otool -L "$bin"; fi

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/rbqn$ext" "dist/rbqn-${{ matrix.target }}$ext"

      - uses: actions/upload-artifact@v4
        with:
          name: rbqn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
